    <div id="swup" class="transition-fade">
        <section class="projects-section container-fluid masthead" style="min-height: 100dvh;">
            <div class="fadebox masthead py-4">
                <div class="container position-relative" style="overflow-y: scroll; height: 75vh;">
                    <h1 class="text-center main-title py-4"></h1>
                    <p id="publications" style="white-space: pre-wrap;" class="text-light"></p>

                    <script>
                        fetch("papers.txt")
                            .then(res => res.text())
                            .then(text => {
                                const formatted = text
                                    // make lines that are exactly 4-digit years bold
                                    .replace(/^(19|20)\d{2}$/gm, "<strong>$&</strong>")
                                    .replace(/(doi\.org\/\S+)/gm,
                                        '<a href="https://$1" target="_blank">link</a>'
                                    );

                                document.getElementById("publications").innerHTML =
                                    formatted;
                            });

                    </script>

                    <section class="position-relative">

                </div>
            </div>
        </section>
    </div>


    <!-- Bootstrap core JS-->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
        <script src="js/scripts.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

        <script>
        particlesJS("particles-js", {
            "particles": {
                "number": {
                    "value": 30,   // Number of particles
                    "density": {
                        "enable": true,
                        "value_area": 800   // Defines the density of the particles
                    }
                },
                "color": {
                    "value": "#d3d3d3"   // Set particle color to red (you can change this to any color you like)
                },
                "shape": {
                    "type": "circle",   // Type of particles (circle, edge, triangle, etc.)
                    "stroke": {
                        "width": 0,
                        "color": "#a9a9a9"
                    }
                },
                "size": {
                    "value": 3,   // Size of the particles
                    "random": true
                },
                "move": {
                    "enable": true,
                    "speed": 3,    // Speed of particle movement
                    "direction": "random",  // Random direction of movement
                    "random": true,
                    "straight": false
                },
                "line_linked": { "enable": true, "distance": 150, "color": "#a9a9a9", "opacity": 0.4, "width": 1 },

            },


            "interactivity": {
                "events": {
                    "onhover": {
                        "enable": false,
                        "mode": "repulse"   // Repulse particles on hover
                    },
                    "onclick": {
                        "enable": false,  // Disable click effect
                        "mode": "push"
                    }
                }
            },

            "retina_detect": true
        });
    </script>
    <script>
        AOS.init();
    </script>
    <script>
        const scroll = new SmoothScroll('a[href*="#"]', {
            speed: 2000, // 🐌 slow scroll (in ms)
            speedAsDuration: true,
            easing: 'easeInOutCubic' // smooth easing
        });
    </script>


    <script>var scene = document.getElementById('scene');
        var parallaxInstance = new Parallax(scene);</script>
